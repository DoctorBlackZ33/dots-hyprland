# DarkArch GPU/audio configuration for handy-launch
# (see local/.local/bin/handy-launch).
#
# Sourced as shell by the launcher; every value has a built-in default, so
# this file only exists to tune model and routing per machine.

# Model for every dictation session (highest quality whisper model) as the
# catalog model ID <repo>/<file>. The fork binary's built-in VRAM gate
# picks the 2080 Ti when enough VRAM is free at session start and falls
# back to strict CPU otherwise.
HANDY_MODEL="handy-computer/whisper-large-v3-gguf/whisper-large-v3-F16.gguf"

# The launcher derives this GPU's PCI bus ID from nvidia-smi and pins it as
# the store's transcribe_gpu_device key (["vulkan","id","<PCI>"]); if the
# GPU is absent the pin is cleared and the fork picks a device on its own.
HANDY_GPU_NAME="NVIDIA GeForce RTX 2080 Ti"

# Handy captures this physical device (cpal/ALSA card name). The pin is
# only applied while the stored mic selection is the system default; a
# manual selection made in the Handy UI sticks. During recording the
# default input is switched to a silent virtual monitor for other
# applications.
HANDY_MICROPHONE="Razer Seiren Elite"
HANDY_MUTE_SINK="handy_muted_input"
HANDY_MUTE_SOURCE="handy_muted_input.monitor"
