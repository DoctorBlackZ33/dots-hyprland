# DarkArch GPU tier configuration for handy-launch
# (see local/.local/bin/handy-launch).
#
# Sourced as shell by the launcher; every value has a built-in default, so
# this file only exists to tune tiering per machine.

# PCI bus ids (lowercase domain:bus:device.function, transcribe.cpp device
# selector format). Auto-detected when unset.
HANDY_PCI_NVIDIA=0000:13:00.0   # RTX 2080 Ti (GA102), headless compute
HANDY_PCI_AMD=0000:03:00.0      # Radeon RX 9070 XT (Navi 48), display + LLM

# Minimum free VRAM (MiB) for each model tier, model file + context headroom.
# whisper-large-v3 Q5_K_M is 1.16 GB, large-v3-turbo Q8_0 is ~1.0 GB.
HANDY_LARGE_VRAM_MB=2048
HANDY_TURBO_VRAM_MB=1536

# Maximum GPU busy percent for a GPU to count as "performance free".
HANDY_BUSY_MAX=50
