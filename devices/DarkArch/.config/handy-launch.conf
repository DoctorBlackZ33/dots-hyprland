# DarkArch GPU/audio configuration for handy-launch
# (see local/.local/bin/handy-launch).
#
# Sourced as shell by the launcher; every value has a built-in default, so
# this file only exists to tune tiering and routing per machine.

# Handy resolves this name to the current transcribe.cpp registry index.
HANDY_GPU_NAME="NVIDIA GeForce RTX 2080 Ti"
HANDY_VRAM_MB=2048

# Recommended streaming model from Handy's catalog.
HANDY_MODEL_PREFERRED="handy-computer/nemotron-3.5-asr-streaming-0.6b-gguf/nemotron-3.5-asr-streaming-0.6b-Q8_0.gguf"

# Handy captures this physical device; the default input is switched to a
# silent virtual monitor for other applications during recording.
HANDY_MICROPHONE="Razer Seiren Elite"
HANDY_MUTE_SINK="handy_muted_input"
HANDY_MUTE_SOURCE="handy_muted_input.monitor"
