# Yazi theme - Material You wallpaper-derived colors
# Based on Catppuccin Mocha structure with chroma-shifted Material tokens

# : Manager {{{

[mgr]
cwd = { fg = "$secondary" }

# Find
find_keyword  = { fg = "$tertiary", bold = true, italic = true, underline = true }
find_position = { fg = "$onSecondaryContainer", bg = "reset", bold = true, italic = true }

# Marker
marker_copied   = { fg = "$success", bg = "$success" }
marker_cut      = { fg = "$error", bg = "$error" }
marker_marked   = { fg = "$secondary", bg = "$secondary" }
marker_selected = { fg = "$tertiary", bg = "$tertiary" }

# Count
count_copied   = { fg = "$onSurface", bg = "$success" }
count_cut      = { fg = "$onSurface", bg = "$error" }
count_selected = { fg = "$onSurface", bg = "$tertiary" }

# Border
border_symbol = "│"
border_style  = { fg = "$outline" }

# : }}}


# : Tabs {{{

[tabs]
active   = { fg = "$onSurface", bg = "$primary", bold = true }
inactive = { fg = "$primary", bg = "$surfaceContainerLow" }

# : }}}


# : Mode {{{

[mode]

normal_main = { fg = "$onSurface", bg = "$primary", bold = true }
normal_alt  = { fg = "$primary", bg = "$surfaceContainerLow" }

# Select mode
select_main = { fg = "$onSurface", bg = "$secondary", bold = true }
select_alt  = { fg = "$secondary", bg = "$surfaceContainerLow" }

# Unset mode
unset_main = { fg = "$onSurface", bg = "$tertiary", bold = true }
unset_alt  = { fg = "$tertiary", bg = "$surfaceContainerLow" }

# : }}}


# : Status bar {{{

[status]
# Permissions
perm_sep   = { fg = "$outline" }
perm_type  = { fg = "$primary" }
perm_read  = { fg = "$tertiary" }
perm_write = { fg = "$error" }
perm_exec  = { fg = "$success" }

# Progress
progress_label  = { fg = "$onSurface", bold = true }
progress_normal = { fg = "$success", bg = "$surfaceContainer" }
progress_error  = { fg = "$tertiary", bg = "$error" }

# : }}}


# : Pick {{{

[pick]
border   = { fg = "$primary" }
active   = { fg = "$onSecondaryContainer", bold = true }
inactive = {}

# : }}}


# : Input {{{

[input]
border   = { fg = "$primary" }
title    = {}
value    = {}
selected = { reversed = true }

# : }}}


# : Completion {{{

[cmp]
border = { fg = "$primary" }

# : }}}


# : Tasks {{{

[tasks]
border  = { fg = "$primary" }
title   = {}
hovered = { fg = "$onSecondaryContainer", bold = true }

# : }}}


# : Which {{{

[which]
mask            = { bg = "$surfaceContainerLow" }
cand            = { fg = "$secondary" }
rest            = { fg = "$outline" }
desc            = { fg = "$onSecondaryContainer" }
separator       = "  "
separator_style = { fg = "$outline" }

# : }}}


# : Help {{{

[help]
on      = { fg = "$secondary" }
run     = { fg = "$onSecondaryContainer" }
hovered = { reversed = true, bold = true }
footer  = { fg = "$surfaceContainerLow", bg = "$onSurface" }

# : }}}


# : Spotter {{{

[spot]
border   = { fg = "$primary" }
title    = { fg = "$primary" }
tbl_col  = { fg = "$secondary" }
tbl_cell = { fg = "$onSecondaryContainer", bg = "$surfaceContainer" }

# : }}}


# : Notification {{{

[notify]
title_info  = { fg = "$success" }
title_warn  = { fg = "$tertiary" }
title_error = { fg = "$error" }

# : }}}


# : File-specific styles {{{

[filetype]

rules = [
	# Image
	{ mime = "image/*", fg = "$secondary" },
	# Media
	{ mime = "{audio,video}/*", fg = "$tertiary" },
	# Archive
	{ mime = "application/{zip,rar,7z*,tar,gzip,xz,zstd,bzip*,lzma,compress,archive,cpio,arj,xar,ms-cab*}", fg = "$onSecondaryContainer" },
	# Document
	{ mime = "application/{pdf,doc,rtf}", fg = "$success" },
	# Virtual file system
	{ mime = "vfs/{absent,stale}", fg = "$outline" },
	# Fallback
	{ url = "*", fg = "$onSurface" },
	{ url = "*/", fg = "$primary" },
]

# : }}}

[icon]

dirs = [
	{ name = ".config", text = "󰉋", fg = "$onSecondaryContainer" },
	{ name = ".git", text = "󰊢", fg = "$secondary" },
	{ name = ".github", text = "󰈔", fg = "$primary" },
	{ name = ".npm", text = "", fg = "$primary" },
	{ name = "Desktop", text = "", fg = "$secondary" },
	{ name = "Development", text = "󰠮", fg = "$secondary" },
	{ name = "Documents", text = "", fg = "$secondary" },
	{ name = "Downloads", text = "", fg = "$secondary" },
	{ name = "Library", text = "󰋱", fg = "$secondary" },
	{ name = "Movies", text = "", fg = "$secondary" },
	{ name = "Music", text = "", fg = "$secondary" },
	{ name = "Pictures", text = "󰉾", fg = "$secondary" },
	{ name = "Public", text = "", fg = "$secondary" },
	{ name = "Videos", text = "", fg = "$secondary" },
]
conds = [
	# Special files
	{ if = "orphan", text = "", fg = "$onSurface" },
	{ if = "link", text = "", fg = "$outline" },
	{ if = "block", text = "", fg = "$tertiary" },
	{ if = "char", text = "", fg = "$tertiary" },
	{ if = "fifo", text = "", fg = "$tertiary" },
	{ if = "sock", text = "", fg = "$tertiary" },
	{ if = "sticky", text = "󰌹", fg = "$tertiary" },
	{ if = "dummy", text = "", fg = "$error" },

	# Fallback
	{ if = "dir & hovered", text = "", fg = "$primary" },
	{ if = "dir", text = "", fg = "$primary" },
	{ if = "exec", text = "", fg = "$success" },
	{ if = "!dir", text = "", fg = "$onSurface" },
]
