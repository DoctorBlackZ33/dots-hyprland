# end-4 system maintenance commands. LazyGit remains the Git review engine;
# these entries provide one place to start the fork-specific workflow.
customCommands:
  - key: '<c-g>'
    description: 'end-4 system maintenance'
    commandMenu:
      - key: 'r'
        description: 'Compare fork and upstream (3-way review)'
        command: 'END4_FROM_LAZYGIT=1 /home/black/end4_custom/end4 review'
        context: 'global'
        output: terminal
      - key: 'm'
        description: 'Merge and review upstream/main'
        command: 'END4_FROM_LAZYGIT=1 /home/black/end4_custom/end4 merge'
        context: 'global'
        output: terminal
        after:
          checkForConflicts: true
      - key: 'u'
        description: 'Preview and deploy end-4 configuration'
        command: 'END4_FROM_LAZYGIT=1 /home/black/end4_custom/end4 update'
        context: 'global'
        output: terminal
        after:
          checkForConflicts: true
      - key: 'd'
        description: 'Discard active uncommitted Git state'
        command: 'END4_FROM_LAZYGIT=1 /home/black/end4_custom/end4 discard'
        context: 'global'
        output: terminal
        after:
          checkForConflicts: true
      - key: 'l'
        description: 'Show end-4 Git/deployment status'
        command: 'END4_FROM_LAZYGIT=1 /home/black/end4_custom/end4 status'
        context: 'global'
        output: terminal
      - key: 's'
        description: 'Show linked development session status'
        command: 'END4_FROM_LAZYGIT=1 /home/black/end4_custom/end4 dev status'
        context: 'global'
        output: terminal
      - key: 'f'
        description: 'Refresh linked development files'
        command: 'END4_FROM_LAZYGIT=1 /home/black/end4_custom/end4 dev refresh'
        context: 'global'
        output: terminal
      - key: 'c'
        description: 'Capture live-only files into the development branch'
        command: 'END4_FROM_LAZYGIT=1 /home/black/end4_custom/end4 dev capture'
        context: 'global'
        output: terminal
      - key: 'h'
        description: 'Reload Hyprland and Quickshell for development'
        command: 'END4_FROM_LAZYGIT=1 /home/black/end4_custom/end4 dev reload all'
        context: 'global'
        output: terminal
      - key: 'x'
        description: 'Stop development and restore stable live state'
        command: 'END4_FROM_LAZYGIT=1 /home/black/end4_custom/end4 dev stop'
        context: 'global'
        output: terminal
      - key: 'k'
        description: 'Stop development and keep tested live files'
        command: 'END4_FROM_LAZYGIT=1 /home/black/end4_custom/end4 dev stop --keep'
        context: 'global'
        output: terminal
